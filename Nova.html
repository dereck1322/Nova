<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F7;--ink:#15181C;--mute:#646B73;--line:#DCE0E4;--acc:#1F3A5F;--onacc:#fff;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1114;--ink:#F1F3F5;--mute:#9AA1A9;--line:#272B31;--acc:#A9C2E8;--onacc:#0F1114;--field:#171A1F}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1114;--ink:#F1F3F5;--mute:#9AA1A9;--line:#272B31;--acc:#A9C2E8;--onacc:#0F1114;--field:#171A1F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:520px;margin:0 auto;padding:24px 22px 48px}
.head{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:52px;height:52px;border-radius:14px;background:#0D1015;display:flex;align-items:center;justify-content:center}
.logo svg{width:40px;height:40px;filter:drop-shadow(0 0 4px rgba(255,255,255,.7)) drop-shadow(0 0 9px rgba(190,215,255,.5))}
.brand{font-size:2.3rem;font-weight:300;letter-spacing:-.04em;line-height:1;margin:0}
.tag{color:var(--mute);margin:4px 0 0;font-size:.9rem;line-height:1.3}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.tab{flex:1;font:inherit;font-weight:600;font-size:.92rem;padding:11px 8px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.photo{display:flex;justify-content:center;margin:16px 0 10px}
.thumbs{display:flex;gap:8px;margin:0 0 22px}
.th{width:62px;height:62px;padding:0;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.th[aria-pressed="true"]{border:2px solid var(--acc)}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.photo img{display:block;max-width:100%;max-height:440px;width:auto;height:auto;border-radius:14px;border:1px solid var(--line)}
h1{font-size:1.45rem;font-weight:600;letter-spacing:-.02em;margin:0}
.sub{color:var(--mute);margin:2px 0 14px}
.price{font-size:2rem;font-weight:700;letter-spacing:-.03em;margin:0 0 18px}
ul{list-style:none;padding:0;margin:0 0 26px;border-top:1px solid var(--line)}
li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.97rem}
label{display:block;font-weight:600;font-size:.92rem;margin:0 0 6px}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:13px 12px;margin-bottom:16px}
select:focus-visible,input:focus-visible,a:focus-visible,.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sum{border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;color:var(--mute)}
.row.total{color:var(--ink);font-weight:700;font-size:1.15rem;border-top:1px solid var(--line)}
.btn{display:block;text-align:center;text-decoration:none;background:var(--acc);color:var(--onacc);font-weight:700;padding:15px;border-radius:10px}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.note{color:var(--mute);font-size:.84rem;margin:14px 0 0}
</style>
</head>
<body>
<main>
<div class="head">
<div class="logo" role="img" aria-label="Logo de Nova"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" stroke="#fff" stroke-width="6"/><path d="M50 24C51.5 40 60 48.5 76 50C60 51.5 51.5 60 50 76C48.5 60 40 51.5 24 50C40 48.5 48.5 40 50 24Z" fill="#fff"/></svg></div>
<div><p class="brand">nova</p><p class="tag">Calidad que se nota. Precio que convence.</p></div>
</div>

<div class="tabs" id="tabs"></div>
<div class="photo"><img id="foto" alt=""></div>
<div class="thumbs" id="thumbs"></div>

<h1 id="nom"></h1>
<p class="sub" id="sub"></p>
<p class="price" id="pre"></p>
<ul id="esp"></ul>

<div id="opcw" hidden><label for="opc">Color</label><select id="opc"></select></div>
<label for="zona">Tu sector en Quito</label>
<select id="zona"><option value="">Elige un sector</option></select>

<label for="ref">Dirección o referencia (opcional)</label>
<input id="ref" type="text" placeholder="Calle, edificio, punto de referencia" autocomplete="street-address">

<div class="sum" aria-live="polite">
<div class="row"><span>Producto</span><span id="p"></span></div>
<div class="row"><span>Envío por inDrive</span><span id="e">Elige un sector</span></div>
<div class="row total"><span>Total</span><span id="t">-</span></div>
</div>

<a id="go" class="btn" aria-disabled="true" href="#" target="_blank" rel="noopener">Pedir por WhatsApp</a>
<p class="note">El envío es un costo estimado según tu sector. El pedido y el pago se confirman por WhatsApp.</p>
</main>

["Sur (Quicentro Sur, Solanda, Guamaní)",2.50],
["Sur lejano (Quitumbe)",3.00],
["Cumbayá",4.00],
["Tumbaco",4.50],
["Conocoto",4.00],
["San Rafael y Sangolquí",4.50],
["Otro sector (te cotizo por WhatsApp)",null]
];
var cur=0,$=function(i){return document.getElementById(i)};
var sel=$("zona"),ref=$("ref"),go=$("go"),tabs=$("tabs");
function m(n){return "$"+n.toFixed(2)}
ZONAS.forEach(function(z,i){var o=document.createElement("option");o.value=i;o.textContent=z[0];sel.appendChild(o)});
PROD.forEach(function(p,i){var b=document.createElement("button");b.className="tab";b.type="button";b.textContent=p.tab;b.onclick=function(){cur=i;draw()};tabs.appendChild(b)});
function pic(i){var p=PROD[cur];$("foto").src=p.imgs[i];$("foto").alt=p.nom+", foto "+(i+1);Array.prototype.forEach.call($("thumbs").children,function(b,k){b.setAttribute("aria-pressed",k===i?"true":"false")})}
function draw(){
  var p=PROD[cur];
  Array.prototype.forEach.call(tabs.children,function(b,i){b.setAttribute("aria-pressed",i===cur?"true":"false")});
  $("thumbs").innerHTML="";p.imgs.forEach(function(s,i){var b=document.createElement("button");b.type="button";b.className="th";b.setAttribute("aria-label","Foto "+(i+1));var im=document.createElement("img");im.src=s;im.alt="";b.appendChild(im);b.onclick=function(){pic(i)};$("thumbs").appendChild(b)});pic(0);
  $("nom").textContent=p.nom;$("sub").textContent=p.sub;$("pre").textContent="$"+p.price;$("p").textContent=m(p.price);
  $("esp").innerHTML="";p.esp.forEach(function(s){var li=document.createElement("li");li.textContent=s;$("esp").appendChild(li)});
  var ow=$("opcw"),os=$("opc");ow.hidden=!p.opc;os.innerHTML="";if(p.opc)p.opc.forEach(function(c){var o=document.createElement("option");o.textContent=c;os.appendChild(o)});
  update();
}
function update(){
  var p=PROD[cur],e=$("e"),t=$("t");
  if(sel.value===""){e.textContent="Elige un sector";t.textContent="-";go.setAttribute("aria-disabled","true");go.href="#";return}
  var z=ZONAS[+sel.value],msg;
  if(z[1]===null){
    e.textContent="Por cotizar";t.textContent=m(p.price)+" + envío";
    msg="Hola Nova, quiero "+p.wa+(p.opc?" en color "+$("opc").value:"")+" ("+m(p.price)+"). Mi sector es: "+(ref.value||"por indicar")+". Me ayudas a cotizar el envío?";
  }else{
    e.textContent=m(z[1]);t.textContent=m(p.price+z[1]);
    msg="Hola Nova, quiero "+p.wa+(p.opc?" en color "+$("opc").value:"")+".\nSector: "+z[0]+"\nProducto: "+m(p.price)+" + envío "+m(z[1])+" = Total "+m(p.price+z[1])+(ref.value?"\nReferencia: "+ref.value:"");
  }
  go.setAttribute("aria-disabled","false");
  go.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg);
}
sel.addEventListener("change",update);$("opc").addEventListener("change",update);ref.addEventListener("input",update);
draw();
</script>
